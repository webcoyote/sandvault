name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install bash/pnpm
        run: brew install bash pnpm

      - name: Install sandvault
        run: ./sv -vvv build

      - name: Install IOS simulator
        run: ./sv -vvv --ios build

      - name: Install Chrome browser
        run: ./sv -vvv --chrome build

      - name: Install Lightpanda browser
        run: |
          brew tap lightpanda-io/browser
          brew trust --tap lightpanda-io/browser
          ./sv -vvv --lightpanda build

      - name: SandVault Tests
        env:
          VERBOSE: 1
        run: ./scripts/tests

      - name: Swift/Xcode Tests
        env:
          XCODE_DESTINATION: platform=macOS,arch=arm64
          VERBOSE: 1
          SV_TESTS_STRICT: 1
        run: ./tests/tests

  nightly-report:
    name: Nightly Report
    needs: test
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Nightly CI failure
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open issue on failure
        if: needs.test.result == 'failure'
        run: |
          existing="$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number')"
          if [[ -z "$existing" ]]; then
            gh issue create --title "$TITLE" --body "Scheduled CI run failed: $RUN_URL"
          fi

      - name: Close issue on success
        if: needs.test.result == 'success'
        run: |
          gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' |
          while read -r number; do
            gh issue close "$number" --comment "Scheduled CI run passed: $RUN_URL"
          done

  tag-version:
    name: Tag Version
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}

      - name: Tag version if updated
        run: .github/scripts/tag-version
