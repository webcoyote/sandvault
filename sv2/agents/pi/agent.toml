# pi coding agent
# Taken from sandvault v1's working wrapper (guest/home/bin/pi) and its
# install step in sv. Checked on 2026-11-27 against pi 1.7.0 (npm; Homebrew
# had 1.6.1). Both installs were run from sv2 that day.
schema = 1

[install.host]
brew = { formula = "pi-coding-agent" }
binary = ["{brew}/bin/pi"]

[install.guest]
script = "install.sh"
# Where install.sh puts it, then where a Bun global install would.
binary = ["~/.local/bin/pi", "~/.bun/bin/pi"]

[run]
# pi runs its tools without asking as it is. --approve answers a different
# question, its project-trust prompt: with it, extensions, skills, prompt
# templates and themes that a project brings along are loaded.
bypass_flag = "--approve"
grants = "it trusts files a project brings along: extensions, skills, prompts, themes"
# pi knows a subcommand only as its first argument: with the flag in front,
# "pi --approve update --extensions" dies on "Unknown option". The package
# commands and config take the flag themselves, after their arguments
# ("install -l" and "config -l" need it to write project settings).
inject_last = ["install", "remove", "uninstall", "update", "list", "config"]
# These reject it outright ("Unknown option --approve."). Checked again
# against pi 1.7.0: its help lists the same eight commands, and "pi mcp list
# --approve" is refused.
no_inject = ["auth", "mcp"]
# Text sv2 has for the agent about its session goes in with this. Checked
# against pi 1.6.1: "pi --approve --append-system-prompt TEXT" is accepted
# with a text of several lines, where a misspelt option is reported as
# "Unknown option". With it in front every subcommand becomes a chat
# message, and all eight pi has are in the two lists above, which keep it
# away from them. pi reads a value that names an existing file as that
# file's contents; sv2's text is prose, not a path.
system_prompt = { flag = "--append-system-prompt" }
